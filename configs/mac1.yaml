# MAC1 experiment configuration
# Replicates the functionality of run_mac1.py

name: "mac1_experiment"

# Structure configuration
structure:
  structure_path: "/home/kchrispens/adp-replicate/tests/resources/mac1_synthetic/5SOP_modified.pdb"
  clean_structure: true
  keep_type: "protein"
  remove_alternative_conformations: true
  complete_residues: true

# Density map configuration
density:
  map_path: "/home/kchrispens/adp-replicate/tests/resources/mac1_synthetic/5sop_5soq_2A.ccp4"
  resolution: 2.0
  em_mode: false

# Output configuration
output_dir: "/home/kchrispens/adp-replicate/_notebooks/testing_mac1"
input_data_dir: "/home/kchrispens/adp-replicate/_notebooks/input/mac1"
boltz_input_yaml: "/home/kchrispens/adp-replicate/_notebooks/input/mac1/test.yaml"

# Model configuration
model:
  version: "boltz2"
  checkpoint_path: "/home/kchrispens/.boltz/boltz2_conf.ckpt"

# Diffusion parameters
diffusion:
  num_steps: 200

# Steering configuration
steering:
  enabled: true
  guidance_update: true
  num_particles: 3

# Adaptive solver configuration
adaptive_solver:
  type: "adam"
  learning_rate: 0.3
  max_iterations: 20
  line_search: true
  adaptive_line_search: true

density_guidance:
  base_weight:
    type: "piecewise"
    breakpoints: [0.125, 0.375]  # 1 - 175/200, 1 - 125/200
    values: [0, 1.0, 0]
  guidance_interval: 1
  resampling_weight:
    type: "piecewise"
    breakpoints: [0.125, 0.25, 0.375]  # 1 - 175/200, 1 - 150/200, 1 - 125/200
    values: 
      - 0.01
      - type: "exponential_bounds"
        start: 0.01
        end: 50
        alpha: 150
        start_t: 0.125
        end_t: 0.25
      - 50
      - 0.0
  scale_guidance_to_denoising: true
  max_guidance_denoising_ratio: 0.01
  resolution:
    type: "piecewise"
    breakpoints: [0.125]  # 1 - 150/200, 1 - 125/200
    values: [2.0, 8.0]  # Resolution changes at these points

# Substructure conditioning for residues 120-140
substructure:
  enabled: true
  selection: "chain A and resi 120-140"
  guidance_weight: 0.05
  resampling_weight: 0.0
  buffer: 0.5

# Optimization configuration
optimization:
  ensemble_size: 4
  partial_diffusion: false
  save_interval: 10
  save_maps: true
  save_scores: true

# Potentials configuration
potentials:
  use_default_potentials: true