name: synthetic_density_test
output_base_dir: results/synthetic_density_test
input_base_dir: input/synthetic_density_test
continue_on_error: true
max_parallel: 1
shared_config:
  name: null
  output_dir: null
  input_data_dir: null
  structure:
    structure_path: null
    clean_structure: true
    keep_type: protein
    remove_all_ligands: true
    remove_alternative_conformations: true
    complete_residues: true
  density:
    map_path: null
    resolution: 2.0
    em_mode: false
  model:
    version: boltz2
    checkpoint_path: /home/kchrispens/.boltz/boltz2_conf.ckpt
  diffusion:
    num_steps: 200
    step_scale: null
    noise_scale: 1.0
    gamma_0: 1.0
    gamma_min: 0.01
  steering:
    enabled: true
    physical_guidance_update: true
    num_particles: 3
    fk_resampling_interval: 1
    fk_lambda: 0.5
    num_gd_steps: 20
  adaptive_solver:
    type: adam
    learning_rate: 0.01
    max_iterations: 20
    convergence_threshold: 0.0001
    gradient_clip_norm: 1.0
    per_potential_scaling: true
    line_search: true
    adaptive_line_search: true
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
  density_guidance:
    base_weight:
      breakpoints:
      - 0.125
      - 0.375
      values:
      - 0
      - 1.0
      - 0
    guidance_interval: 1
    resampling_weight:
      breakpoints:
      - 0.125
      - 0.25
      - 0.375
      values:
      - 0.01
      - start: 0.01
        end: 50
        alpha: 150
        start_t: 0.125
        end_t: 0.25
      - 50
      - 0.0
    scale_guidance_to_denoising: true
    max_guidance_denoising_ratio: 0.5
    resolution:
      breakpoints:
      - 0.25
      values:
      - 2.0
      - 8.0
  substructure:
    enabled: true
    guidance_weight: 0.05
    resampling_weight: 0.0
    buffer: 0.5
  optimization:
    ensemble_size: 4
    partial_diffusion: false
    save_interval: 10
    save_maps: true
    save_scores: true
  potentials:
    use_default_potentials: true
