[project]
authors = [{name = "Karson Chrispens", email = "karson.chrispens@ucsf.edu"}]
dependencies = [
    "numpy",
    "torch>=2.5.1",
    "pandas",
    "scikit-learn",
    "scipy",
    "tqdm",
    "matplotlib",
    "pytest",
    "mrcfile",
    "gemmi",
    "rdkit",
    "einops",
    "setuptools",
    "biopython",
]
name = "adp3d"
requires-python = ">=3.10"
version = "0.1.0"
readme = "README.md"
description = "EDG: A package for generating ensemble models into density maps"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
adp3d = { path = ".", editable = true }
boltz = { path = "../boltz", editable = true }

[tool.pixi.tasks]
mac1_synthetic = "python ./_notebooks/run_mac1.py"

[tool.pixi.dependencies]
python = "3.10.*"
pip = ">=25.1.1,<26"
