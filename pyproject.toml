[project]
authors = [{name = "Karson Chrispens", email = "karson.chrispens@ucsf.edu"}]
dependencies = [ "setuptools", "numpy", "torch", "pandas", "scikit-learn", "scipy", "tqdm", "matplotlib", "mrcfile", "gemmi", "rdkit", "einops", "biopython", "opt-einsum", "notebook", "pyyaml"]
name = "edg"
requires-python = ">=3.10"
version = "0.1.0"
readme = "README.md"
description = "EDG: A package for generating ensemble models into density maps"

[project.scripts]
edg = "edg.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3.5,<9"]
visualization = ["matplotlib", "seaborn"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
edg = { path = ".", editable = true }
boltz = { path = "../boltz", editable = true }

[tool.pixi.tasks]
mac1_synthetic = "python ./_notebooks/run_mac1.py"
aaawaaa = "python ./_notebooks/run_AAAWAAA.py"
more_awa = "python ./_notebooks/run_more_AWA.py"
cuda_density_test = "python ./tests/test_density.py"

[tool.pixi.dependencies]
python = "3.10.*"
pip = ">=25.1.1,<26"
gcc_linux-64 = ">=9,<13"
gxx_linux-64 = ">=9,<13"
ninja = "*"
ruff = ">=0.12.2,<0.13"

[tool.pixi.environments]
default = {features = [], solve-group = "default"}
test = {features = ["test"], solve-group = "default"}
visualization = {features = ["visualization"], solve-group = "default"}
